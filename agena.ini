; agena single-host configuration example
; Start with: ./build/agena agena.ini
; For multiple hosts, see agena-vhosts.ini.

[server]
; address and port to listen on
BindAddress = 127.0.0.1
Port = 1965

; directory served over Gemini
DocumentRoot = www
Index = index.gmi

[tls]
; paths to the server certificate and private key
CertificateFile = cert.pem
PrivateKeyFile = key.pem

; requests a TLS 1.3 minimum; enforcement has a known integration-test failure
RequireTLS13 = false

[cgi]
; URLs starting with this prefix are run as CGI programs under DocumentRoot
PathPrefix = /cgi-bin/

; Extension-to-MIME overrides; built-in mappings remain for unlisted extensions.
[types]
mp3 = audio/mpeg
ogg = audio/ogg
jpg = image/jpeg
png = image/png
gif = image/gif
pdf = application/pdf

; See agena-vhosts.ini for separate document roots and certificates on one port.
