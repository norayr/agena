; agena multiple-host configuration example
; Adjust paths, then start with: ./build/agena agena-vhosts.ini
; For a single host, see agena.ini.
; Certificate SANs must contain the ASCII/Punycode names used by clients.

[server]
BindAddress = 0.0.0.0
Port = 1965
Index = index.gmi

[tls]
RequireTLS13 = false

[cgi]
PathPrefix = /cgi-bin/

[vhost:norayr.am]
DocumentRoot = /srv/gemini/norayr.am/pub
CertificateFile = /srv/gemini/norayr.am/norayr.am.crt
PrivateKeyFile = /srv/gemini/norayr.am/norayr.am.key

[vhost:սոնա.հայ]
DocumentRoot = /srv/gemini/սոնա.հայ/pub
CertificateFile = /srv/gemini/սոնա.հայ/fullchain.pem
PrivateKeyFile = /srv/gemini/սոնա.հայ/privkey.pem
Index = index.gmi
; Empty CGIPrefix disables CGI for this host.
CGIPrefix =

[types]
mp3 = audio/mpeg
ogg = audio/ogg
jpg = image/jpeg
jpeg = image/jpeg
png = image/png
gif = image/gif
pdf = application/pdf
